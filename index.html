<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --action-color: #3b82f6;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 1650px;
            width: 98%;
            margin: 0 auto;
        }

        .auth-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-badge {
            background: rgba(59, 130, 246, 0.2);
            color: var(--action-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .auth-actions {
            display: flex;
            gap: 10px;
        }

        .btn-auth {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-auth:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        .btn-clone {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 600;
        }
        .btn-clone:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success-color);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .main-layout {
            display: flex;
            gap: 40px;
            align-items: start;
            position: relative;
        }

        .fixed-sidebar {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 20px;
            width: 350px;
            min-width: 350px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s;
            overflow: hidden;
            position: relative;
        }

        .fixed-sidebar.collapsed {
            width: 60px;
            min-width: 60px;
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.03);
        }

        .fixed-sidebar.collapsed .sidebar-content {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }

        .sidebar-content {
            opacity: 1;
            transition: opacity 0.3s ease 0.1s;
        }

        .btn-toggle-di {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 6px;
            width: 36px;
            height: 36px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            user-select: none;
        }
        .btn-toggle-di:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .fixed-sidebar .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .fixed-sidebar.collapsed .column-header {
            border-bottom: none;
            justify-content: center;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            align-items: start;
            flex-grow: 1;
        }

        .column-wrapper {
            background: rgba(17, 24, 39, 0.3);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid transparent;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        
/* Esconde as ações de gerenciamento da coluna por padrão */
        .column-header .column-actions-wrapper {
            opacity: 0;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
        }

        /* Mostra as ações somente quando passar o mouse sobre o cabeçalho da coluna */
        .column-wrapper:hover .column-actions-wrapper {
            opacity: 1;
        }
        
        .column-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-add {
            background: rgba(59, 130, 246, 0.1);
            color: var(--action-color);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-add:hover { background: rgba(59, 130, 246, 0.2); }

        .btn-add-timeline {
            display: block;
            margin: 40px auto 0;
            padding: 12px 24px;
            font-size: 1rem;
        }

        .btn-action {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            width: 32px;
            height: 32px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            font-size: 14px;
            margin-left: 6px;
        }

        .btn-edit { color: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; }
        .btn-edit:hover { color: #ffffff; border-color: #ffffff; background: rgba(255, 255, 255, 0.2); }

        .btn-delete { color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); cursor: pointer; }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.25); box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); border-color: #ef4444; }

        .btn-drag { color: var(--text-muted); border: 1px dashed rgba(255, 255, 255, 0.3); cursor: grab; }
        .btn-drag:hover { color: #ffffff; border-color: #ffffff; background: rgba(255, 255, 255, 0.1); }
        .btn-drag:active { cursor: grabbing; }

        .period-block {
            margin-bottom: 20px;
            border-radius: 6px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        
        .sortable-ghost { opacity: 0.4; } 

        .period-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            position: relative;
        }

        .period-header .period-actions {
            display: flex; align-items: center;
            opacity: 0; transition: opacity 0.15s;
        }
        .period-header:hover .period-actions { opacity: 1; }

        .period-header-click {
            flex-grow: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .period-title { font-weight: 600; font-size: 1.1rem; color: #ffffff; }
        .period-date {
            font-size: 0.85rem; background: rgba(0,0,0,0.25);
            padding: 4px 10px; border-radius: 4px; color: rgba(255,255,255,0.9);
        }

        .accordion-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease;
        }
        .period-block.open > .accordion-wrapper, .event-item.open > .accordion-wrapper { grid-template-rows: 1fr; }
        .accordion-content { overflow: hidden; }
        .period-inner-content { padding: 20px; border-top: 1px solid var(--border-color); }
        .period-text { color: var(--text-main); margin-bottom: 20px; font-size: 0.95rem; }

        .split-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .split-col-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .split-col h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }

        .event-item { margin-bottom: 8px; }
        .event-trigger-container {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; border-radius: 4px; transition: background 0.2s;
        }
        .event-trigger-container:hover { background-color: rgba(255,255,255,0.05); }
        .fixed-sidebar .event-trigger-container:hover { background-color: rgba(255,255,255,0.1); }

        .event-trigger-container .item-actions { 
            display: flex; align-items: center;
            opacity: 0; transition: opacity 0.15s;
        }
        .event-trigger-container:hover .item-actions { opacity: 1; }

        .event-trigger { flex-grow: 1; cursor: pointer; display: flex; align-items: center; flex-wrap: wrap; user-select: none; }
        .event-name { font-size: 0.9rem; font-weight: 500; }
        .event-date-badge {
            font-size: 0.75rem; color: var(--text-muted); background: rgba(255,255,255,0.05);
            padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: 400;
        }
        .event-desc {
            padding: 10px 10px 10px 24px; font-size: 0.85rem; color: var(--text-muted);
            border-left: 2px solid var(--border-color); margin-left: 14px; margin-top: 4px; margin-bottom: 8px;
        }

        .icon-arrow { fill: currentColor; opacity: 0.6; transition: transform 0.3s ease; margin-left: 10px; }
        .period-block.open .period-header-click .icon-arrow { transform: rotate(180deg); }
        .event-item.open .icon-arrow { transform: rotate(180deg); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 500px;
            padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        .modal-content h3 { margin-bottom: 20px; color: #fff; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        
        /* Cabeçalho da área de formatação */
        .desc-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .text-formatter-bar {
            display: flex;
            gap: 4px;
        }
        .btn-format {
            background: #1f2937;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
            user-select: none;
        }
        .btn-format:hover {
            background: #374151;
            border-color: var(--text-muted);
        }
        .btn-format.btn-italic {
            font-style: italic;
            font-family: "Georgia", serif;
        }

        .input-group input[type="text"], .input-group input[type="password"] {
            width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);
            background: #1f2937; color: #fff; font-family: inherit;
        }

        /* Editor Visual WYSIWYG ContentEditable */
        .rich-editor-box {
            width: 100%;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #1f2937;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.5;
            outline: none;
        }
        .rich-editor-box:focus {
            border-color: var(--action-color);
        }
        /* Garantindo que as tags internas herdem a estilização correta em tempo real */
        .rich-editor-box strong { font-weight: bold; color: #ffffff; }
        .rich-editor-box em { font-style: italic; }

        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-save { background: var(--action-color); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn-cancel { background: transparent; color: #fff; border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 4px; cursor: pointer; }

        .delete-alert-box {
            padding: 12px;
            color: #f87171;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        @media (max-width: 1150px) { 
            .main-layout { flex-direction: column; }
            .fixed-sidebar { width: 100%; min-width: 100%; }
            .fixed-sidebar.collapsed { width: 100%; min-width: 100%; }
            .timeline-grid { grid-template-columns: 1fr; width: 100%; } 
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="auth-bar">
        <div class="user-info" id="auth-user-info">
            <span>🌐 Visualizando como Público Geral</span>
        </div>
        <div class="auth-actions" id="auth-actions-area">
            <button class="btn-auth" onclick="openAuthModal('login')">Entrar</button>
            <button class="btn-auth" onclick="openAuthModal('register')">Criar Conta Convidado</button>
        </div>
    </div>

    <header>
        <h1>Linha do Tempo</h1>
        <p>Uma investigação visual</p>
    </header>

    <div class="main-layout">
        <div class="fixed-sidebar" id="fixed-sidebar-container"></div>
        <div id="app-container" class="timeline-grid"></div>
    </div>

    <button id="btn-master-add" class="btn-add btn-add-timeline" onclick="openModal('timeline')" style="display:none;">+ Adicionar Nova Linha do Tempo</button>
</div>

<div class="modal-overlay" id="modal-auth">
    <div class="modal-content" style="max-width: 400px;">
        <h3 id="auth-modal-title">Entrar no Sistema</h3>
        <div class="input-group">
            <label>E-mail</label>
            <input type="text" id="auth-email" placeholder="seuemail@exemplo.com">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="auth-password" placeholder="••••••••">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeAuthModal()">Cancelar</button>
            <button class="btn-save" id="btn-auth-submit" onclick="handleAuthSubmit()">Confirmar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <h3 id="modal-title">Adicionar Item</h3>
        
        <div id="modal-delete-warning" style="display: none; margin-bottom: 20px;"></div>

        <div id="modal-fields-wrapper">
            <div class="input-group" id="group-title">
                <label id="label-title">Título / Nome</label>
                <input type="text" id="input-title">
            </div>
            <div class="input-group" id="group-date" style="display:none;">
                <label>Data / Período</label>
                <input type="text" id="input-date">
            </div>
            <div class="input-group" id="group-color" style="display:none;">
                <label>Cor de Fundo do Bloco</label>
                <input type="color" id="input-color" value="#1d4ed8">
            </div>
            <div class="input-group" id="group-desc" style="display:none;">
                <div class="desc-label-row">
                    <label style="margin-bottom: 0;">Texto Descritivo / Análise Crítica</label>
                    <div class="text-formatter-bar">
                        <button type="button" class="btn-format" onmousedown="event.preventDefault(); formatSelectedText('bold')">B</button>
                        <button type="button" class="btn-format btn-italic" onmousedown="event.preventDefault(); formatSelectedText('italic')">I</button>
                    </div>
                </div>
                <div id="input-desc" class="rich-editor-box" contenteditable="true"></div>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-save" id="btn-modal-submit" onclick="saveItem()">Salvar</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://xucuaqvqqrsdqlmqhinb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1Y3VhcXZxcXJzZHFsbXFoaW5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDg1NDcsImV4cCI6MjA5NjY4NDU0N30.M29g8rdpYzRwLl4N5fx0HbBaqY5Frqe4eS2hUEO93XU";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let timelines = [];
    let fixedSidebarData = { id: 'fixed', title: 'Descobertas e Invenções', items: [] };
    let isCollapsedDI = false;
    let currentUser = null;
    let currentUserRole = 'public';
    let currentModalContext = {};
    let authMode = 'login';
    
    let openAccordionsRegistry = new Set();

    const ADMIN_UUID = "1f8fafcb-ac79-479a-a1f3-3bf63c9ad62d";

    async function checkUserSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (session) {
            currentUser = session.user;
            currentUserRole = (currentUser.id === ADMIN_UUID) ? 'admin' : 'guest';
            
            document.getElementById('auth-user-info').innerHTML = `
                <span>✅ Conectado: <strong>${currentUser.email}</strong></span>
                <span class="user-badge" style="background:${currentUserRole === 'admin' ? '#b91c1c' : '#1d4ed8'}; color:#fff;">
                    ${currentUserRole === 'admin' ? 'Autor Principal' : 'Convidado'}
                </span>
            `;
            document.getElementById('auth-actions-area').innerHTML = `<button class="btn-auth" onclick="handleLogout()">Sair</button>`;
            if (currentUserRole === 'admin') {
                document.getElementById('btn-master-add').style.display = 'block';
            }
        } else {
            currentUser = null;
            currentUserRole = 'public';
            document.getElementById('auth-user-info').innerHTML = `<span>🌐 Visualizando como Público Geral</span>`;
            document.getElementById('auth-actions-area').innerHTML = `
                <button class="btn-auth" onclick="openAuthModal('login')">Entrar</button>
                <button class="btn-auth" onclick="openAuthModal('register')">Criar Conta Convidado</button>
            `;
            document.getElementById('btn-master-add').style.display = 'none';
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        await loadData(urlParams.get('id'));
        setupRealtimeSubscription();
    }

    async function loadData(targetId = null) {
        document.querySelectorAll('.period-block.open, .event-item.open').forEach(el => {
            if (el.id) openAccordionsRegistry.add(el.id);
        });

        let query = supabaseClient.from('timelines').select('*');
        
        if (targetId) {
            query = query.eq('id', targetId);
        } else if (currentUser) {
            query = query.eq('user_id', currentUser.id);
        } else {
            query = query.eq('is_public', true);
        }

        const { data: tlData } = await query.order('position');
        timelines = tlData || [];

        for (let tl of timelines) {
            const { data: pData } = await supabaseClient.from('periods').select('*').eq('timeline_id', tl.id).order('position');
            tl.periods = pData || [];
            
            for (let per of tl.periods) {
                const { data: iData } = await supabaseClient.from('items').select('*').eq('period_id', per.id).order('position');
                per.events = iData ? iData.filter(i => i.type === 'event') : [];
                per.works = iData ? iData.filter(i => i.type === 'work') : [];
            }
        }

        const { data: diData } = await supabaseClient.from('fixed_discoveries').select('*').order('position');
        fixedSidebarData.items = diData || [];

        render();
        renderCloneButtonIfNeeded(targetId);
    }

    function renderCloneButtonIfNeeded(targetId) {
        if (!targetId || timelines.length === 0) return;
        const currentTimeline = timelines[0];
        
        if (!currentUser || currentUser.id !== currentTimeline.user_id) {
            const actionsArea = document.getElementById('auth-actions-area');
            if (!document.getElementById('btn-clone-dynamic')) {
                const cloneBtn = document.createElement('button');
                cloneBtn.id = "btn-clone-dynamic";
                cloneBtn.className = "btn-auth btn-clone";
                cloneBtn.innerText = "🍃 Duplicar para o meu Painel";
                cloneBtn.onclick = () => duplicateTimeline(currentTimeline.id);
                actionsArea.prepend(cloneBtn);
            }
        }
    }

    async function duplicateTimeline(timelineIdOrigem) {
        if (!currentUser) {
            alert("Você precisa criar uma conta ou fazer login para poder duplicar este modelo!");
            return openAuthModal('login');
        }

        const { data: origTl } = await supabaseClient.from('timelines').select('*').eq('id', timelineIdOrigem).single();
        if (!origTl) return;

        const { data: newTl, error: errTl } = await supabaseClient.from('timelines')
            .insert({ title: origTl.title + " (Cópia)", user_id: currentUser.id, is_public: false })
            .select().single();

        if (errTl) return alert("Erro ao duplicar estrutura.");

        const { data: periods } = await supabaseClient.from('periods').select('*').eq('timeline_id', timelineIdOrigem);
        
        for (let per of (periods || [])) {
            const { data: newPer } = await supabaseClient.from('periods')
                .insert({ timeline_id: newTl.id, title: per.title, date_str: per.date_str, color: per.color, description: per.description })
                .select().single();

            const { data: items } = await supabaseClient.from('items').select('*').eq('period_id', per.id);
            if (items && items.length > 0) {
                const itemsToInsert = items.map(i => ({
                    period_id: newPer.id,
                    type: i.type,
                    name: i.name,
                    date_str: i.date_str,
                    description: i.description
                }));
                await supabaseClient.from('items').insert(itemsToInsert);
            }
        }

        alert("Linha do tempo clonada com sucesso! Redirecionando para o seu painel...");
        window.location.href = window.location.pathname;
    }

    function setupRealtimeSubscription() {
        supabaseClient
            .channel('any-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public' }, () => {
                const urlParams = new URLSearchParams(window.location.search);
                loadData(urlParams.get('id'));
            })
            .subscribe();
    }

    function determineEditable(tlOwnerId) {
        if (!currentUser) return false;
        if (currentUserRole === 'admin') return true;
        return currentUser.id === tlOwnerId;
    }

    function renderSidebarContent() {
        const sidebarContainer = document.getElementById('fixed-sidebar-container');
        const canEditDI = (currentUserRole === 'admin');

        if (isCollapsedDI) {
            sidebarContainer.classList.add('collapsed');
            sidebarContainer.innerHTML = `<div class="column-header"><button class="btn-toggle-di" onclick="toggleDI()">⇾</button></div>`;
        } else {
            sidebarContainer.classList.remove('collapsed');
            sidebarContainer.innerHTML = `
                <div class="column-header">
                    <h2 class="column-title">${fixedSidebarData.title}</h2>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        ${canEditDI ? `<button class="btn-add" onclick="openModal('discovery_item', '${fixedSidebarData.id}')">+</button>` : ''}
                        <button class="btn-toggle-di" onclick="toggleDI()">⇽</button>
                    </div>
                </div>
                <div class="sidebar-content">
                    <div id="disc-container-fixed"></div>
                </div>
            `;
            const discContainer = sidebarContainer.querySelector('#disc-container-fixed');
            fixedSidebarData.items.forEach(item => {
                discContainer.appendChild(createItemHTML(item, fixedSidebarData.id, null, 'discovery_item', canEditDI));
            });
        }
    }

    function render() {
        renderSidebarContent();
        const container = document.getElementById('app-container');
        container.innerHTML = '';

        if (timelines.length === 0) {
            container.innerHTML = `<p style="color:var(--text-muted); padding: 20px;">Nenhuma linha do tempo encontrada aqui. Clique em Entrar ou criar conta para começar.</p>`;
        } else {
            timelines.forEach(tl => {
                const canEditThisTimeline = determineEditable(tl.user_id);
                let col = document.createElement('div');
                col.className = 'column-wrapper';
                col.id = `tl_wrapper_${tl.id}`;
                col.innerHTML = `
                    <div class="column-header">
                        <h2 class="column-title">${tl.title}</h2>
                        <div style="display: flex; align-items: center;">
                            ${canEditThisTimeline ? `
                                <button class="btn-add" onclick="openModal('period', '${tl.id}')">+ Período</button>
                                
                                <div class="column-actions-wrapper">
                                    <button class="btn-action btn-edit" onclick="openModal('timeline', '${tl.id}', null, null, true)">✏️</button>
                                    <button class="btn-action btn-delete" onclick="openModal('timeline', '${tl.id}', null, null, false, true)">✕</button>
                                    <button class="btn-action btn-drag drag-column">⋮⋮</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    <div class="periods-container" id="periods-${tl.id}"></div>
                `;
                container.appendChild(col);

                const periodsContainer = col.querySelector(`#periods-${tl.id}`);
                if (tl.periods) {
                    tl.periods.forEach(per => {
                        let pBlock = document.createElement('div');
                        pBlock.id = `block_${per.id}`;
                        
                        pBlock.className = openAccordionsRegistry.has(pBlock.id) ? 'period-block open' : 'period-block';
                        
                        pBlock.innerHTML = `
                            <div class="period-header" style="background-color: ${per.color || '#1e293b'};">
                                <div class="period-header-click" onclick="toggleAccordion(this.parentElement.parentElement)">
                                    <span class="period-title">${per.title}</span>
                                    <span class="period-date">${per.date_str || ''}</span>
                                    <svg class="icon-arrow" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                                </div>
                                <div class="period-actions">
                                    ${canEditThisTimeline ? `
                                        <button class="btn-action btn-edit" onclick="openModal('period', '${tl.id}', '${per.id}', null, true)">✏️</button>
                                        <button class="btn-action btn-delete" onclick="openModal('period', '${tl.id}', '${per.id}', null, false, true)">✕</button>
                                        <button class="btn-action btn-drag drag-period">⋮⋮</button>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="accordion-wrapper">
                                <div class="accordion-content">
                                    <div class="period-inner-content">
                                        ${per.description ? `<div class="period-text">${per.description}</div>` : ''}
                                        <div class="split-content">
                                            <div class="split-col">
                                                <div class="split-col-header">
                                                    <h4>EVENTOS</h4>
                                                    ${canEditThisTimeline ? `<button class="btn-add" onclick="openModal('event', '${tl.id}', '${per.id}')">+ Add</button>` : ''}
                                                </div>
                                                <div id="events-${per.id}" class="items-sortable-list" data-period="${per.id}" data-type="event"></div>
                                            </div>
                                            <div class="split-col">
                                                <div class="split-col-header">
                                                    <h4>OBRAS / TEXTOS</h4>
                                                    ${canEditThisTimeline ? `<button class="btn-add" onclick="openModal('work', '${tl.id}', '${per.id}')">+ Add</button>` : ''}
                                                </div>
                                                <div id="works-${per.id}" class="items-sortable-list" data-period="${per.id}" data-type="work"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        periodsContainer.appendChild(pBlock);

                        const evContainer = pBlock.querySelector(`#events-${per.id}`);
                        if (per.events) per.events.forEach(ev => { evContainer.appendChild(createItemHTML(ev, tl.id, per.id, 'event', canEditThisTimeline)); });

                        const wkContainer = pBlock.querySelector(`#works-${per.id}`);
                        if (per.works) per.works.forEach(wk => { wkContainer.appendChild(createItemHTML(wk, tl.id, per.id, 'work', canEditThisTimeline)); });
                    });
                }
            });
        }
        
        openAccordionsRegistry.clear();
        setTimeout(initSortables, 50);
    }

    function createItemHTML(item, tlId, perId, type, canEdit) {
        let div = document.createElement('div');
        div.id = `item_${item.id}`;
        div.className = openAccordionsRegistry.has(div.id) ? 'event-item open' : 'event-item';
        div.innerHTML = `
            <div class="event-trigger-container">
                <div class="event-trigger" onclick="toggleAccordion(this.parentElement.parentElement)">
                    <span class="event-name">${item.name}</span>
                    <span class="event-date-badge">${item.date_str || ''}</span>
                    ${item.description ? '<svg class="icon-arrow" width="14" height="14" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>' : ''}
                </div>
                <div class="item-actions">
                    ${canEdit ? `
                        <button class="btn-action btn-edit" onclick="openModal('${type}', '${tlId}', '${perId}', '${item.id}', true)">✏️</button>
                        <button class="btn-action btn-delete" onclick="openModal('${type}', '${tlId}', '${perId}', '${item.id}', false, true)">✕</button>
                        <button class="btn-action btn-drag drag-item">⋮⋮</button>
                    ` : ''}
                </div>
            </div>
            ${item.description ? `
            <div class="accordion-wrapper">
                <div class="accordion-content"><div class="event-desc">${item.description}</div></div>
            </div>` : ''}
        `;
        return div;
    }

    function toggleAccordion(element) { element.classList.toggle('open'); }
    function toggleDI() { isCollapsedDI = !isCollapsedDI; renderSidebarContent(); }

    function openAuthModal(mode) {
        authMode = mode;
        document.getElementById('auth-modal-title').innerText = mode === 'login' ? 'Entrar no Sistema' : 'Criar Conta Convidado';
        document.getElementById('modal-auth').classList.add('active');
    }
    function closeAuthModal() { document.getElementById('modal-auth').classList.remove('active'); }

    async function handleAuthSubmit() {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;

        if (authMode === 'register') {
            const { data, error } = await supabaseClient.auth.signUp({ 
                email, 
                password,
                options: { data: { username: email.split('@')[0], role: 'guest' } }
            });
            if (error) return alert(error.message);
            alert("Cadastro realizado com sucesso! Para sua segurança, enviamos um link de confirmação para o seu e-mail. Ative-o antes de tentar entrar.");
            closeAuthModal();
        } else {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) return alert(error.message);
            document.getElementById('modal-auth').classList.remove('active');
            window.location.reload();
        }
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        window.location.reload();
    }

    function openModal(type, tlId = null, perId = null, itemId = null, isEdit = false, isDelete = false) {
        currentModalContext = { type, tlId, perId, itemId, isEdit, isDelete };

        document.getElementById('input-title').value = '';
        document.getElementById('input-date').value = '';
        document.getElementById('input-desc').innerHTML = ''; // Limpa o contenteditable de forma correta

        const modalTitleEl = document.getElementById('modal-title');
        const submitBtn = document.getElementById('btn-modal-submit');
        const deleteWarningEl = document.getElementById('modal-delete-warning');
        const fieldsWrapper = document.getElementById('modal-fields-wrapper');

        if (submitBtn) {
            submitBtn.style.backgroundColor = 'var(--action-color)';
            submitBtn.innerText = 'Salvar';
        }
        deleteWarningEl.style.display = 'none';
        deleteWarningEl.innerHTML = '';
        fieldsWrapper.style.display = 'block';

        document.getElementById('group-date').style.display = type === 'timeline' ? 'none' : 'block';
        document.getElementById('group-desc').style.display = type === 'timeline' ? 'none' : 'block';
        document.getElementById('group-color').style.display = type === 'period' ? 'block' : 'none';

        if (isDelete) {
            modalTitleEl.innerText = `Confirmar Exclusão`;
            fieldsWrapper.style.display = 'none';

            let identificadorNome = "este registro";
            if (type === 'timeline') {
                const tl = timelines.find(t => t.id === tlId);
                identificadorNome = `a Linha do Tempo "${tl?.title || ''}" e TODOS os seus sub-períodos, eventos e análises vinculadas`;
            } else if (type === 'period') {
                const tl = timelines.find(t => t.id === tlId);
                const per = tl?.periods?.find(p => p.id === perId);
                identificadorNome = `o Período "${per?.title || ''}" e todas as suas obras e eventos acoplados`;
            } else if (type === 'discovery_item') {
                const item = fixedSidebarData.items.find(i => i.id === itemId);
                identificadorNome = `a descoberta fixa "${item?.name || ''}"`;
            } else {
                const tl = timelines.find(t => t.id === tlId);
                const per = tl?.periods?.find(p => p.id === perId);
                const lista = type === 'event' ? per?.events : per?.works;
                const item = lista?.find(i => i.id === itemId);
                identificadorNome = `o item "${item?.name || ''}"`;
            }

            deleteWarningEl.innerHTML = `
                <div class="delete-alert-box">
                    ⚠️ <strong>Atenção Absoluta:</strong> Tem certeza que deseja eliminar de forma permanente <strong>${identificadorNome}</strong>? Esta ação executará uma limpeza direta nas tabelas do banco de dados e não poderá ser desfeita.
                </div>
            `;
            deleteWarningEl.style.display = 'block';

            if (submitBtn) {
                submitBtn.style.backgroundColor = 'var(--danger-color)';
                submitBtn.innerText = 'Excluir Definitivamente';
            }
            
            document.getElementById('modal').classList.add('active');
            return; 
        }

        let prefixoAcao = isEdit ? "Editar" : "Adicionar";
        if (type === 'timeline') modalTitleEl.innerText = `${prefixoAcao} Linha do Tempo`;
        if (type === 'period') modalTitleEl.innerText = `${prefixoAcao} Período`;
        if (type === 'event') modalTitleEl.innerText = `${prefixoAcao} Evento`;
        if (type === 'work') modalTitleEl.innerText = `${prefixoAcao} Obra / Texto`;
        if (type === 'discovery_item') modalTitleEl.innerText = `${prefixoAcao} Item Fixo`;

        if (isEdit) {
            if (type === 'timeline') {
                const tl = timelines.find(t => t.id === tlId);
                if (tl) document.getElementById('input-title').value = tl.title || '';
            } else if (type === 'period') {
                const tl = timelines.find(t => t.id === tlId);
                const per = tl?.periods?.find(p => p.id === perId);
                if (per) {
                    document.getElementById('input-title').value = per.title || '';
                    document.getElementById('input-date').value = per.date_str || '';
                    document.getElementById('input-desc').innerHTML = per.description || '';
                    if (per.color) document.getElementById('input-color').value = per.color;
                }
            } else if (type === 'event' || type === 'work') {
                const tl = timelines.find(t => t.id === tlId);
                const per = tl?.periods?.find(p => p.id === perId);
                const listaAlvo = type === 'event' ? per?.events : per?.works;
                const item = listaAlvo?.find(i => i.id === itemId);
                
                if (item) {
                    document.getElementById('input-title').value = item.name || '';
                    document.getElementById('input-date').value = item.date_str || '';
                    document.getElementById('input-desc').innerHTML = item.description || '';
                }
            } else if (type === 'discovery_item') {
                const item = fixedSidebarData.items.find(i => i.id === itemId);
                if (item) {
                    document.getElementById('input-title').value = item.name || '';
                    document.getElementById('input-date').value = item.date_str || '';
                    document.getElementById('input-desc').innerHTML = item.description || '';
                }
            }
        }

        document.getElementById('modal').classList.add('active');
    }
    
    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    // --- EXECUÇÃO DE COMANDOS WYSIWYG REAIS NA SELEÇÃO ---
    function formatSelectedText(styleType) {
        // execCommand aplica o efeito diretamente na seleção e alterna (liga/desliga) nativamente
        if (styleType === 'bold') {
            document.execCommand('bold', false, null);
        } else if (styleType === 'italic') {
            document.execCommand('italic', false, null);
        }
    }

    async function saveItem() {
        let { type, tlId, perId, itemId, isEdit, isDelete } = currentModalContext;
        if (!currentUser) return alert("Você precisa estar logado para executar alterações.");

        if (isDelete) {
            if (type === 'timeline') await supabaseClient.from('timelines').delete().eq('id', tlId);
            else if (type === 'period') await supabaseClient.from('periods').delete().eq('id', perId);
            else if (type === 'event' || type === 'work') await supabaseClient.from('items').delete().eq('id', itemId);
            else if (type === 'discovery_item') await supabaseClient.from('fixed_discoveries').delete().eq('id', itemId);

            closeModal();
            const urlParams = new URLSearchParams(window.location.search);
            await loadData(urlParams.get('id'));
            return;
        }

        const title = document.getElementById('input-title').value.trim();
        const date = document.getElementById('input-date').value.trim();
        // Extrai o código HTML interno gerado pelo ContentEditable para salvar no banco
        const desc = document.getElementById('input-desc').innerHTML.trim();
        const color = document.getElementById('input-color').value;

        if (type === 'timeline') {
            if (isEdit) await supabaseClient.from('timelines').update({ title }).eq('id', tlId);
            else await supabaseClient.from('timelines').insert({ title, user_id: currentUser.id, is_public: true });
        } else if (type === 'period') {
            if (isEdit) await supabaseClient.from('periods').update({ title, date_str: date, description: desc, color }).eq('id', perId);
            else await supabaseClient.from('periods').insert({ timeline_id: tlId, title, date_str: date, description: desc, color });
        } else if (type === 'event' || type === 'work') {
            if (isEdit) await supabaseClient.from('items').update({ name: title, date_str: date, description: desc }).eq('id', itemId);
            else await supabaseClient.from('items').insert({ period_id: perId, type, name: title, date_str: date, description: desc });
        } else if (type === 'discovery_item') {
            if (isEdit) await supabaseClient.from('fixed_discoveries').update({ name: title, date_str: date, description: desc }).eq('id', itemId);
            else await supabaseClient.from('fixed_discoveries').insert({ name: title, date_str: date, description: desc, user_id: currentUser.id });
        }

        closeModal();
        const urlParams = new URLSearchParams(window.location.search);
        await loadData(urlParams.get('id'));
    }

    function initSortables() {
        if (!currentUser) return;

        const gridContainer = document.getElementById('app-container');
        if (gridContainer && timelines.length > 0) {
            new Sortable(gridContainer, {
                animation: 150, handle: '.drag-column',
                onEnd: async function (evt) {
                    const moved = timelines.splice(evt.oldIndex, 1)[0];
                    timelines.splice(evt.newIndex, 0, moved);
                    for (let i = 0; i < timelines.length; i++) {
                        await supabaseClient.from('timelines').update({ position: i }).eq('id', timelines[i].id);
                    }
                }
            });
        }

        timelines.forEach(tl => {
            const pContainer = document.getElementById(`periods-${tl.id}`);
            if (pContainer && tl.periods) {
                new Sortable(pContainer, {
                    animation: 150, handle: '.drag-period',
                    onEnd: async function (evt) {
                        const moved = tl.periods.splice(evt.oldIndex, 1)[0];
                        tl.periods.splice(evt.newIndex, 0, moved);
                        for (let i = 0; i < tl.periods.length; i++) {
                            await supabaseClient.from('periods').update({ position: i }).eq('id', tl.periods[i].id);
                        }
                    }
                });

                tl.periods.forEach(per => {
                    ['events', 'works'].forEach(subType => {
                        const idSelector = subType === 'events' ? `events-${per.id}` : `works-${per.id}`;
                        const itemContainer = document.getElementById(idSelector);
                        if (itemContainer) {
                            new Sortable(itemContainer, {
                                animation: 150, handle: '.drag-item',
                                onEnd: async function (evt) {
                                    const arrayRef = per[subType];
                                    const moved = arrayRef.splice(evt.oldIndex, 1)[0];
                                    arrayRef.splice(evt.newIndex, 0, moved);
                                    for (let i = 0; i < arrayRef.length; i++) {
                                        await supabaseClient.from('items').update({ position: i }).eq('id', arrayRef[i].id);
                                    }
                                }
                            });
                        }
                    });
                });
            }
        });

        const discoveriesContainer = document.getElementById('disc-container-fixed');
        if (discoveriesContainer && fixedSidebarData.items.length > 0) {
            new Sortable(discoveriesContainer, {
                animation: 150, handle: '.drag-item',
                onEnd: async function (evt) {
                    const moved = fixedSidebarData.items.splice(evt.oldIndex, 1)[0];
                    fixedSidebarData.items.splice(evt.newIndex, 0, moved);
                    for (let i = 0; i < fixedSidebarData.items.length; i++) {
                        await supabaseClient.from('fixed_discoveries').update({ position: i }).eq('id', fixedSidebarData.items[i].id);
                    }
                }
            });
        }
    }

    document.addEventListener("DOMContentLoaded", checkUserSession);
</script>
