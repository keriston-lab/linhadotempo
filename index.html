<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo Crítica da Antiguidade</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --action-color: #3b82f6;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 1500px;
            width: 95%;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Ajuste Crucial: Força exatamente 2 colunas simétricas por linha */
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            align-items: start;
        }

        .column-wrapper {
            background: rgba(17, 24, 39, 0.3);
            border-radius: 8px;
            padding: 20px;
            border: 1px dashed transparent;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .column-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* Botões de Ação Básicos */
        .btn-add {
            background: rgba(59, 130, 246, 0.1);
            color: var(--action-color);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-add:hover { background: rgba(59, 130, 246, 0.2); }

        .btn-add-timeline {
            display: block;
            margin: 40px auto 0;
            padding: 12px 24px;
            font-size: 1rem;
        }

        /* Botões de Ação com contorno (Editar, Excluir, Arrastar) */
        .btn-action {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            width: 32px;
            height: 32px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            font-size: 14px;
            margin-left: 6px;
        }

        .btn-edit {
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }
        .btn-edit:hover {
            color: #ffffff;
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-delete {
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            cursor: pointer;
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.25);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); 
            border-color: #ef4444;
        }

        .btn-drag {
            color: var(--text-muted);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            cursor: grab;
        }
        .btn-drag:hover {
            color: #ffffff;
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-drag:active { cursor: grabbing; }

        /* Blocos de Período */
        .period-block {
            margin-bottom: 20px;
            border-radius: 6px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        
        .sortable-ghost { opacity: 0.4; } 

        .period-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            position: relative;
        }

        .period-header-click {
            flex-grow: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .period-title { font-weight: 600; font-size: 1.1rem; color: #ffffff; }
        .period-date {
            font-size: 0.85rem; background: rgba(0,0,0,0.25);
            padding: 4px 10px; border-radius: 4px; color: rgba(255,255,255,0.9);
        }

        /* Sistema de Accordion */
        .accordion-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease;
        }
        .period-block.open > .accordion-wrapper, .event-item.open > .accordion-wrapper { grid-template-rows: 1fr; }
        .accordion-content { overflow: hidden; }
        .period-inner-content { padding: 20px; border-top: 1px solid var(--border-color); }
        .period-text { color: var(--text-main); margin-bottom: 20px; font-size: 0.95rem; }

        /* Layout Interno: Eventos e Obras */
        .split-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .split-col-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .split-col h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }

        /* Itens de Eventos/Obras */
        .event-item { margin-bottom: 8px; }
        .event-trigger-container {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px; border-radius: 4px; transition: background 0.2s;
        }
        .event-trigger-container:hover { background-color: rgba(255,255,255,0.05); }
        .event-trigger { flex-grow: 1; cursor: pointer; display: flex; align-items: center; flex-wrap: wrap; user-select: none; }
        .event-name { font-size: 0.9rem; font-weight: 500; }
        .event-date-badge {
            font-size: 0.75rem; color: var(--text-muted); background: rgba(255,255,255,0.05);
            padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: 400;
        }
        .event-desc {
            padding: 10px 10px 10px 24px; font-size: 0.85rem; color: var(--text-muted);
            border-left: 2px solid var(--border-color); margin-left: 14px; margin-top: 4px; margin-bottom: 8px;
        }

        .icon-arrow { fill: currentColor; opacity: 0.6; transition: transform 0.3s ease; margin-left: 10px; }
        .period-block.open .period-header-click .icon-arrow { transform: rotate(180deg); }
        .event-item.open .icon-arrow { transform: rotate(180deg); }

        /* Modal Universal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 500px;
            padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        .modal-content h3 { margin-bottom: 20px; color: #fff; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input[type="text"], .input-group textarea {
            width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);
            background: #1f2937; color: #fff; font-family: inherit;
        }
        .input-group textarea { min-height: 100px; resize: vertical; }
        .input-group input[type="color"] {
            width: 100%; height: 40px; padding: 2px; border: 1px solid var(--border-color);
            background: #1f2937; border-radius: 4px; cursor: pointer;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-save { background: var(--action-color); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background: transparent; color: #fff; border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 4px; cursor: pointer; }

        /* Responsividade para telas de celulares e tablets verticais */
        @media (max-width: 1024px) { 
            .timeline-grid { grid-template-columns: 1fr; } 
        }
        @media (max-width: 600px) { .split-content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Linha do Tempo Crítica da Antiguidade</h1>
        <p>Uma investigação visual sobre Percepção, Estruturas de Poder e a Desconstrução de Discursos Narrativos.</p>
    </header>

    <div id="app-container" class="timeline-grid">
        </div>

    <button class="btn-add btn-add-timeline" onclick="openModal('timeline')">+ Adicionar Nova Coluna / Linha do Tempo</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <h3 id="modal-title">Adicionar Item</h3>
        
        <div class="input-group" id="group-title">
            <label>Título / Nome</label>
            <input type="text" id="input-title" placeholder="Ex: Grécia, Período Clássico, Édipo Rei...">
        </div>
        
        <div class="input-group" id="group-date" style="display:none;">
            <label>Data / Período</label>
            <input type="text" id="input-date" placeholder="Ex: 480 a.C. — 323 a.C.">
        </div>
        
        <div class="input-group" id="group-color" style="display:none;">
            <label>Cor de Fundo do Bloco</label>
            <input type="color" id="input-color" value="#1d4ed8">
        </div>

        <div class="input-group" id="group-desc" style="display:none;">
            <label>Texto Descritivo</label>
            <textarea id="input-desc" placeholder="Sua análise crítica..."></textarea>
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-save" onclick="saveItem()">Salvar</button>
        </div>
    </div>
</div>

<script>
    const defaultData = [
        {
            id: 't_grecia', title: 'Grécia',
            periods: [
                {
                    id: 'p_trevas', title: 'Idade das Trevas Grega', date: 'c. 1100 a.C. — 800 a.C.', color: '#1e293b',
                    desc: 'Período marcado pelo colapso da civilização micênica. Longe de ser apenas um "vazio", foi o caldeirão silencioso onde a tradição oral gestou a base mítica ocidental, operando à margem de instituições centralizadoras de poder.',
                    events: [], works: []
                },
                {
                    id: 'p_arcaico', title: 'Período Arcaico Grego', date: 'c. 800 a.C. — 480 a.C.', color: '#b45309',
                    desc: 'Nascimento das Polis (cidades-estado). Aqui, os mitos deixam de ser apenas narrativas rituais e passam a ser fixados em obras que tentam organizar a estrutura cósmica e a hierarquia do poder.',
                    events: [
                        { id: 'e_olimp', name: 'Primeiros Jogos Olímpicos', date: '776 a.C.', desc: 'Unificou culturalmente os povos gregos, transformando a violência guerreira em espetáculo ritualizado sob a chancela do poder.' }
                    ],
                    works: [
                        { id: 'w_homero', name: 'Ilíada e Odisseia (Homero)', date: 'c. 750 a.C.', desc: 'Sob o verniz das batalhas, esconde-se a primeira anatomia da fragilidade humana frente às narrativas e forças institucionais.' },
                        { id: 'w_hesiodo', name: 'Teogonia (Hesíodo)', date: 'c. 700 a.C.', desc: 'Sistematiza o power de Zeus. Registro seminal do Mito de Prometeu: a eterna tensão entre autonomia técnica humana e punição arbitrária do Estado/Deuses.' }
                    ]
                },
                {
                    id: 'p_classico', title: 'Período Clássico Grego', date: '480 a.C. — 323 a.C.', color: '#1d4ed8',
                    desc: 'O auge filosófico e político de Atenas. Sob a razão e democracia, floresce o imperialismo. Berço das obras que rasgaram o discurso oficial e mergulharam na falha da percepção humana.',
                    events: [
                        { id: 'e_pericles', name: 'Governo de Péricles', date: '461 — 429 a.C.', desc: 'Apogeu de Atenas que alimentou a arrogância institucional e cimentou o poder através do monopólio da narrativa.' },
                        { id: 'e_socrates', name: 'Condenação de Sócrates', date: '399 a.C.', desc: 'A instituição elimina fisicamente o elemento que forçava a desconstrução das ilusões sociais da massa.' },
                        { id: 'e_pelo', name: 'Guerra do Peloponeso', date: '431 — 404 a.C.', desc: 'Conflito destrutivo entre Atenas e Esparta, colapsando a ilusão do ideal helênico.' }
                    ],
                    works: [
                        { id: 'w_antigona', name: 'Antígona (Sófocles)', date: '441 a.C.', desc: 'Embate destrutivo entre a lei arbitrária do Grande Outro (Estado) e a ética insubmissa do sujeito.' },
                        { id: 'w_edipo', name: 'Édipo Rei (Sófocles)', date: '429 a.C.', desc: 'A anatomia da cegueira psíquica. O sujeito descobre que suas certezas conscientes são fraudes e que ele é operado por forças ocultas.' },
                        { id: 'w_bacantes', name: 'As Bacantes (Eurípides)', date: '405 a.C.', desc: 'O retorno avassalador do reprimido. A instituição estatal tenta recalcar a pulsão irracional e acaba estraçalhada por ela.' },
                        { id: 'w_republica', name: 'A República (Platão)', date: '375 a.C.', desc: 'Contém a Alegoria da Caverna: o trauma de descobrir que a realidade compartilhada é apenas uma narrativa fabricada por quem detém o poder de projetar as sombras.' }
                    ]
                },
                {
                    id: 'p_helenistico', title: 'Período Helenístico', date: '323 a.C. — 31 a.C.', color: '#6d28d9',
                    desc: 'A Polis perde autonomia e os cidadãos integram impérios vastos. Diante da máquina opressora, surgem escolas radicais de rejeição ou adaptação ao Grande Outro.',
                    events: [
                        { id: 'e_alex', name: 'Alexandre, o Grande', date: '336 — 323 a.C.', desc: 'Unificação forçada e aniquilação das autonomias locais. A força bruta se torna o único lastro da realidade.' },
                        { id: 'e_cinica', name: 'A Ruptura Cínica (Diógenes)', date: 'c. 323 a.C.', desc: 'A rejection absoluta do sistema simbólico. Provando que a única imunidade contra a máquina institucional é cuspir nas expectativas que a sustentam.' }
                    ],
                    works: []
                }
            ]
        },
        {
            id: 't_roma', title: 'Roma',
            periods: [
                {
                    id: 'p_republica', title: 'República Romana', date: '509 a.C. — 27 a.C.', color: '#991b1b',
                    desc: 'Estabelecimento de um complexo sistema de freios institucionais gerido pelo Senado. Colapsou quando o poder militar se descolou do discurso legal.',
                    events: [
                        { id: 'e_cesar', name: 'Assassinato de Júlio César', date: '44 a.C.', desc: 'O colapso da velha narrativa republicana. O assassinato precipita a substituição da burocracia por um poder pessoal incontestável.' }
                    ], works: []
                },
                {
                    id: 'p_imperio', title: 'Império Romano', date: '27 a.C. — 476 d.C.', color: '#b45309',
                    desc: 'Centralização total. A transição da Antiguidade para o alvorecer da Idade Média: o controle passa de vigilância física para vigilância psicológica interna.',
                    events: [
                        { id: 'e_augusto', name: 'Ascensão de Augusto', date: '27 a.C. — 14 d.C.', desc: 'A invenção da "Pax Romana": uma narrativa cosmética criada para anestesiar o esvaziamento político das antigas instituições livres.' },
                        { id: 'e_nero', name: 'Tirania de Nero', date: '54 — 68 d.C.', desc: 'O Leviatã sem freios. O Estado manifesta sua psicopatia pura através de expurgos e desequilíbrio absolutista.' },
                        { id: 'e_marco', name: 'Governo de Marco Aurélio', date: '161 — 180 d.C.', desc: 'A máquina pesada. O imperador estóico tenta manter a ordem externa enquanto reconhece a futilidade das glórias do império.' }
                    ],
                    works: [
                        { id: 'w_seneca', name: 'Cartas a Lucílio (Sêneca)', date: '65 d.C.', desc: 'Manual de sobrevivência. Desconstrói a vaidade, o prestígio vazio e prova que a miséria existencial é fruto das exigências fúteis da sociedade.' },
                        { id: 'w_meditacoes', name: 'Meditações (Marco Aurélio)', date: 'c. 161 — 180 d.C.', desc: 'A busca desesperada por manter o tribunal interno intacto diante do ruído incessante do poder político.' },
                        { id: 'w_agostinho', name: 'Confissões (Agostinho de Hipona)', date: '397 d.C.', desc: 'A invenção da neurose ocidental. Agostinho internaliza o olhar do poder: a transgressão deixa de ser apenas cívica para se tornar uma mancha inata no sujeito.' }
                    ]
                }
            ]
        }
    ];

    let timelines;
    try {
        const saved = localStorage.getItem('antiqTimelineData');
        timelines = saved ? JSON.parse(saved) : null;
        if (!timelines || timelines.length === 0) {
            timelines = defaultData;
        }
    } catch(e) {
        timelines = defaultData;
    }

    let currentModalContext = {}; 

    function initSortables() {
        if (typeof Sortable === 'undefined') return;

        const container = document.getElementById('app-container');
        new Sortable(container, {
            animation: 150,
            handle: '.drag-column',
            onEnd: function (evt) {
                const movedItem = timelines.splice(evt.oldIndex, 1)[0];
                timelines.splice(evt.newIndex, 0, movedItem);
                saveOnlyData();
            }
        });

        timelines.forEach(tl => {
            const periodsContainer = document.getElementById(`periods-${tl.id}`);
            if (periodsContainer) {
                new Sortable(periodsContainer, {
                    animation: 150,
                    handle: '.drag-period',
                    onEnd: function (evt) {
                        let tlRef = timelines.find(t => t.id === tl.id);
                        const movedItem = tlRef.periods.splice(evt.oldIndex, 1)[0];
                        tlRef.periods.splice(evt.newIndex, 0, movedItem);
                        saveOnlyData();
                    }
                });

                tl.periods.forEach(per => {
                    const evContainer = document.getElementById(`events-${per.id}`);
                    const wkContainer = document.getElementById(`works-${per.id}`);
                    
                    if (evContainer) {
                        new Sortable(evContainer, {
                            animation: 150, handle: '.drag-item',
                            onEnd: function (evt) {
                                let perRef = timelines.find(t => t.id === tl.id).periods.find(p => p.id === per.id);
                                const movedItem = perRef.events.splice(evt.oldIndex, 1)[0];
                                perRef.events.splice(evt.newIndex, 0, movedItem);
                                saveOnlyData();
                            }
                        });
                    }
                    if (wkContainer) {
                        new Sortable(wkContainer, {
                            animation: 150, handle: '.drag-item',
                            onEnd: function (evt) {
                                let perRef = timelines.find(t => t.id === tl.id).periods.find(p => p.id === per.id);
                                const movedItem = perRef.works.splice(evt.oldIndex, 1)[0];
                                perRef.works.splice(evt.newIndex, 0, movedItem);
                                saveOnlyData();
                            }
                        });
                    }
                });
            }
        });
    }

    function render() {
        const container = document.getElementById('app-container');
        container.innerHTML = ''; 

        timelines.forEach(tl => {
            let col = document.createElement('div');
            col.className = 'column-wrapper';
            
            col.innerHTML = `
                <div class="column-header">
                    <h2 class="column-title">${tl.title}</h2>
                    <div style="display: flex; align-items: center;">
                        <button class="btn-add" onclick="openModal('period', '${tl.id}')">+ Período</button>
                        <button class="btn-action btn-edit" title="Editar Nome da Coluna" onclick="openModal('timeline', '${tl.id}', null, null, true)">✏️</button>
                        <button class="btn-action btn-delete" title="Excluir Coluna" onclick="deleteItem('timeline', '${tl.id}')">✕</button>
                        <button class="btn-action btn-drag drag-column" title="Mover Coluna">⋮⋮</button>
                    </div>
                </div>
                <div class="periods-container" id="periods-${tl.id}"></div>
            `;
            container.appendChild(col);

            const periodsContainer = col.querySelector(`#periods-${tl.id}`);

            tl.periods.forEach(per => {
                let pBlock = document.createElement('div');
                pBlock.className = 'period-block';
                pBlock.innerHTML = `
                    <div class="period-header" style="background-color: ${per.color};">
                        <div class="period-header-click" onclick="toggleAccordion(this.parentElement.parentElement)">
                            <span class="period-title">${per.title}</span>
                            <span class="period-date">${per.date}</span>
                            <svg class="icon-arrow" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                        </div>
                        <div style="display:flex; align-items: center;">
                            <button class="btn-action btn-edit" title="Editar Período" onclick="openModal('period', '${tl.id}', '${per.id}', null, true)">✏️</button>
                            <button class="btn-action btn-delete" title="Excluir Período" onclick="deleteItem('period', '${tl.id}', '${per.id}')">✕</button>
                            <button class="btn-action btn-drag drag-period" title="Mover Período">⋮⋮</button>
                        </div>
                    </div>
                    <div class="accordion-wrapper">
                        <div class="accordion-content">
                            <div class="period-inner-content">
                                ${per.desc ? `<div class="period-text">${per.desc}</div>` : ''}
                                <div class="split-content">
                                    <div class="split-col">
                                        <div class="split-col-header">
                                            <h4>EVENTOS</h4>
                                            <button class="btn-add" onclick="openModal('event', '${tl.id}', '${per.id}')">+ Add</button>
                                        </div>
                                        <div id="events-${per.id}"></div>
                                    </div>
                                    <div class="split-col">
                                        <div class="split-col-header">
                                            <h4>OBRAS / TEXTOS</h4>
                                            <button class="btn-add" onclick="openModal('work', '${tl.id}', '${per.id}')">+ Add</button>
                                        </div>
                                        <div id="works-${per.id}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                periodsContainer.appendChild(pBlock);

                const evContainer = pBlock.querySelector(`#events-${per.id}`);
                per.events.forEach(ev => { evContainer.appendChild(createItemHTML(ev, tl.id, per.id, 'event')); });

                const wkContainer = pBlock.querySelector(`#works-${per.id}`);
                per.works.forEach(wk => { wkContainer.appendChild(createItemHTML(wk, tl.id, per.id, 'work')); });
            });
        });

        setTimeout(initSortables, 50); 
    }

    function createItemHTML(item, tlId, perId, type) {
        let div = document.createElement('div');
        div.className = 'event-item';
        div.innerHTML = `
            <div class="event-trigger-container">
                <div class="event-trigger" onclick="toggleAccordion(this.parentElement.parentElement)">
                    <span class="event-name">${item.name}</span>
                    <span class="event-date-badge">${item.date}</span>
                    ${item.desc ? '<svg class="icon-arrow" width="14" height="14" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>' : ''}
                </div>
                <div style="display: flex; align-items: center;">
                    <button class="btn-action btn-edit" title="Editar" onclick="openModal('${type}', '${tlId}', '${perId}', '${item.id}', true)">✏️</button>
                    <button class="btn-action btn-delete" title="Excluir" onclick="deleteItem('${type}', '${tlId}', '${perId}', '${item.id}')">✕</button>
                    <button class="btn-action btn-drag drag-item" title="Mover Item">⋮⋮</button>
                </div>
            </div>
            ${item.desc ? `
            <div class="accordion-wrapper">
                <div class="accordion-content">
                    <div class="event-desc">${item.desc}</div>
                </div>
            </div>` : ''}
        `;
        return div;
    }

    function toggleAccordion(element) {
        element.classList.toggle('open');
    }

    function saveOnlyData() {
        localStorage.setItem('antiqTimelineData', JSON.stringify(timelines));
    }

    function saveDataAndRender() {
        localStorage.setItem('antiqTimelineData', JSON.stringify(timelines));
        render();
    }

    function generateId() {
        return '_' + Math.random().toString(36).substr(2, 9);
    }

    function deleteItem(type, tlId, perId = null, itemId = null) {
        if (!confirm('Tem certeza que deseja excluir?')) return;

        if (type === 'timeline') {
            timelines = timelines.filter(t => t.id !== tlId);
        } else if (type === 'period') {
            let tl = timelines.find(t => t.id === tlId);
            tl.periods = tl.periods.filter(p => p.id !== perId);
        } else if (type === 'event' || type === 'work') {
            let tl = timelines.find(t => t.id === tlId);
            let per = tl.periods.find(p => p.id === perId);
            if (type === 'event') per.events = per.events.filter(e => e.id !== itemId);
            if (type === 'work') per.works = per.works.filter(w => w.id !== itemId);
        }
        saveDataAndRender();
    }

    function openModal(type, tlId = null, perId = null, itemId = null, isEdit = false) {
        currentModalContext = { type, tlId, perId, itemId, isEdit };
        
        let titleVal = ''; let dateVal = ''; let descVal = ''; let colorVal = '#1d4ed8';

        if (isEdit) {
            if (type === 'timeline') {
                let tl = timelines.find(t => t.id === tlId); titleVal = tl.title;
            } else if (type === 'period') {
                let tl = timelines.find(t => t.id === tlId); let per = tl.periods.find(p => p.id === perId);
                titleVal = per.title; dateVal = per.date; descVal = per.desc; colorVal = per.color;
            } else if (type === 'event' || type === 'work') {
                let tl = timelines.find(t => t.id === tlId); let per = tl.periods.find(p => p.id === perId);
                let item = type === 'event' ? per.events.find(e => e.id === itemId) : per.works.find(w => w.id === itemId);
                titleVal = item.name; dateVal = item.date; descVal = item.desc;
            }
        }

        document.getElementById('input-title').value = titleVal;
        document.getElementById('input-date').value = dateVal;
        document.getElementById('input-desc').value = descVal;
        document.getElementById('input-color').value = colorVal;

        document.getElementById('group-date').style.display = type === 'timeline' ? 'none' : 'block';
        document.getElementById('group-desc').style.display = type === 'timeline' ? 'none' : 'block';
        document.getElementById('group-color').style.display = type === 'period' ? 'block' : 'none';

        let titles = { 
            'timeline': isEdit ? 'Editar Coluna' : 'Nova Coluna', 
            'period': isEdit ? 'Editar Período' : 'Novo Período', 
            'event': isEdit ? 'Editar Evento' : 'Novo Evento', 
            'work': isEdit ? 'Editar Obra/Texto' : 'Nova Obra/Texto' 
        };
        document.getElementById('modal-title').innerText = titles[type];
        document.getElementById('modal').classList.add('active');
    }

    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    function saveItem() {
        let title = document.getElementById('input-title').value.trim();
        let date = document.getElementById('input-date').value.trim();
        let desc = document.getElementById('input-desc').value.trim();
        let color = document.getElementById('input-color').value;

        if (!title) return alert('O título/nome é obrigatório!');

        let { type, tlId, perId, itemId, isEdit } = currentModalContext;

        if (isEdit) {
            if (type === 'timeline') { timelines.find(t => t.id === tlId).title = title; } 
            else if (type === 'period') {
                let per = timelines.find(t => t.id === tlId).periods.find(p => p.id === perId);
                per.title = title; per.date = date; per.desc = desc; per.color = color;
            } else if (type === 'event' || type === 'work') {
                let item = type === 'event' ? timelines.find(t => t.id === tlId).periods.find(p => p.id === perId).events.find(e => e.id === itemId) : timelines.find(t => t.id === tlId).periods.find(p => p.id === perId).works.find(w => w.id === itemId);
                item.name = title; item.date = date; item.desc = desc;
            }
        } else {
            if (type === 'timeline') { timelines.push({ id: generateId(), title: title, periods: [] }); } 
            else if (type === 'period') { timelines.find(t => t.id === tlId).periods.push({ id: generateId(), title, date, desc, color, events: [], works: [] }); } 
            else if (type === 'event' || type === 'work') {
                let newItem = { id: generateId(), name: title, date, desc };
                if (type === 'event') timelines.find(t => t.id === tlId).periods.find(p => p.id === perId).events.push(newItem);
                else timelines.find(t => t.id === tlId).periods.find(p => p.id === perId).works.push(newItem);
            }
        }
        closeModal(); saveDataAndRender();
    }

    document.addEventListener("DOMContentLoaded", function() {
        render();
    });
</script>

</body>
</html>
